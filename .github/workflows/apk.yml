name: APK Mascotas

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Probar los movimientos
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultado-pruebas
          path: app/build/reports/tests/

      - name: Compilar APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mascotas-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # En main, si cambió versionName (app/build.gradle.kts) y aún no hay versión
      # publicada con ese número, se crea la Release v<versión> con el APK.
      # También adjunta el APK si alguien publica una versión a mano en Releases.
      - name: Publicar la versión en Releases
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            VERSION=$(sed -n 's/.*versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts)
            TAG="v$VERSION"
          fi
          APK="mascotas-en-pantalla-$TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "${{ github.event_name }}" = release ]; then
              gh release upload "$TAG" "$APK" --clobber
            else
              echo "La versión $TAG ya está publicada; sube versionName para publicar otra."
            fi
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
              --title "Mascotas en pantalla $TAG" --notes-file .github/release-notes.md
          fi

  prueba:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mascotas-apk
          path: apk

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Soltar mascotas en un emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: bash .github/scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-mascotas
          path: shots/
