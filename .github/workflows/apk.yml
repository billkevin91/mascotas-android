name: APK Mascotas

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Probar los movimientos
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultado-pruebas
          path: app/build/reports/tests/

      - name: Compilar APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mascotas-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Al publicar una versión en Releases (v1.0, v1.1...) se le adjunta el APK
      - name: Adjuntar el APK a la versión
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "mascotas-en-pantalla-$TAG.apk"
          gh release upload "$TAG" "mascotas-en-pantalla-$TAG.apk" --clobber

  prueba:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mascotas-apk
          path: apk

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Soltar mascotas en un emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: bash .github/scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-mascotas
          path: shots/
